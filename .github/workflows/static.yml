# softopshub.com now redirects to https://softops.tech. This publishes only the redirect page in
# redirect/ (as index.html and 404.html, so every path is covered). The old React site source is
# kept in the repo for reference but is no longer built.
name: Deploy redirect to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './redirect'
      - id: deployment
        uses: actions/deploy-pages@v4
